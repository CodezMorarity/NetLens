[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netlens-analyzer"
version = "1.0.0"
description = "A cross-platform CLI for live packet capture and offline network analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Tejas Chandola"}]
dependencies = ["scapy>=2.7,<3", "colorama>=0.4.6,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "build>=1,<2"]

[project.scripts]
netlens = "netlens.cli:main"

[tool.setuptools.packages.find]
include = ["netlens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
